[project]
name = "claude-code-memory-proxy"
version = "0.1.0"
description = "Claude Code memory MCP server with streaming proxy for Anthropic tools"
readme = "README.md"
authors = [
    { name = "Dmitry Stratiychuk" }
]
requires-python = ">=3.12"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "anthropic>=0.71.0",
    "fastapi>=0.120.0",
    "fastmcp>=2.13.0",
    "httpx>=0.28.1",
    "uvicorn>=0.38.0",
]

[project.scripts]
memory-server = "claude_code_memory_proxy.memory_server:main"
memory-proxy = "claude_code_memory_proxy.proxy:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "requests>=2.32.0",
]
